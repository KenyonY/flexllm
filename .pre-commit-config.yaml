repos:
  # Ruff: 替代 black + isort + flake8
  # rev 必须与 pyproject.toml 里钉的 ruff 版本一致：CI 直接跑 ruff format --check，
  # 版本不同会与本 hook 的格式化结果相反，互相把代码改回去。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 基础检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict

  # 单元测试 (pre-push)
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest tests/unit/ -q --tb=short -m "not slow"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
