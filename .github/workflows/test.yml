name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Lint with ruff
        run: |
          ruff check flexllm tests
          ruff format --check flexllm tests

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      # 真实行为测试：本地 mock server，覆盖断点续传/pool 路由/缓存组合，无需 API key
      - name: Run mock e2e tests
        run: pytest tests/test_mock_e2e.py -v --tb=short
