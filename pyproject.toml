[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flexllm"
description = "High-performance LLM client with batch processing, caching, and checkpoint recovery"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "kunyuan", email = "beidongjiedeguang@gmail.com"}
]
keywords = ["llm", "openai", "gemini", "claude", "anthropic", "batch", "async", "cache", "multimodal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"

dynamic = ["version"]

dependencies = [
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
    "tqdm>=4.60.0",
    "rich>=12.0.0",
    "loguru>=0.6.0",
    "orjson",
    "json5>=0.9.0",
    "aiolimiter>=1.1.0",
    "numpy",
    "pillow",
    "python-dotenv>=0.19.0",
    "pyyaml>=6.0",
    "typer>=0.24.1",
    "flaxkv2>=0.2.5",
]

[project.scripts]
flexllm = "flexllm.__main__:main"
xllm = "flexllm.__main__:main"

[project.optional-dependencies]
vertex = [
    # Vertex AI 模式需要 google-auth 获取访问令牌
    "google-auth>=2.0.0",
]
cache = [
    "flaxkv2>=0.2.0",
]
memory = [
    "flaxkv2>=0.2.0",
]
image = [
    "opencv-python",
]
audio = [
    "soundfile>=0.12.0",
    "scipy>=1.9.0",
]
cli = [
    "typer>=0.9.0",
]
token = [
    "tiktoken>=0.5.0",
]
all = [
    "flexllm[vertex,cache,memory,image,audio,cli,token]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    # ruff 钉死：格式化结果随版本变化，宽松约束会让 CI/hook/本地各装一个版本、
    # 互相把代码改回去。升级时需与 .pre-commit-config.yaml 的 rev 一起改。
    "ruff==0.9.7",
    "pre-commit>=3.7.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-aiohttp>=1.0.0",
    "pandas>=1.3.0",
    "opencv-python",
    "flaxkv2>=0.2.0",
    "pyyaml>=6.0",
    # 同 dev：需与 .pre-commit-config.yaml 的 rev 保持一致
    "ruff==0.9.7",
    # tests/unit/test_cli_*.py 会加载 CLI 并断言 typer.Exit 的退出码。
    # 此处刻意保持宽松：typer 是库的运行时依赖，钉死会给下游造成依赖冲突；
    # 让 CI 装最新版才能及早发现上游行为变更（如 0.26 把 click vendor 进
    # typer._click 并移除外部 click 依赖）。代码只用公开 API typer.Exit。
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/KenyonY/flexllm"
Repository = "https://github.com/KenyonY/flexllm"
Documentation = "https://github.com/KenyonY/flexllm#readme"
Issues = "https://github.com/KenyonY/flexllm/issues"

[tool.hatch.version]
path = "flexllm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["flexllm"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["I", "F"]  # isort + pyflakes（未使用导入/变量、未定义名称）

[tool.ruff.lint.isort]
known-first-party = ["flexllm"]
